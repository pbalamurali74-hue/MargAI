// REAL-TIME SMARTPHONE SENSOR & ROAD MOVEMENT SYNC
var phoneSync = true;
var lastBumpTime = 0;
function pollSmartphoneMovement() {
  if (!phoneSync || (ws && ws.readyState === 1)) return;
  fetch('/api/smartphone/status')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.connected && d.telemetry) {
        // 1. Live Speed from Phone GPS
        if (d.telemetry.speed_kmh !== undefined && d.telemetry.speed_kmh > 0) {
          var spd = Math.round(d.telemetry.speed_kmh);
          V = spd / 3.6;
          $('sp').textContent = spd;
          // Dynamically adjust road lane flow duration
          var line = $('dashLine');
          if (line) {
            line.style.animationDuration = (17.5 / Math.max(V, 0.5)) + 's';
          }
        }

        // 2. Road Curvature & Road Tilting
        if (d.telemetry.road_geometry) {
          var ct = d.telemetry.road_geometry.curve_type || 'STRAIGHT';
          if (ct === 'SHARP_LEFT' || ct === 'HAIRPIN_BEND') {
            $('world').style.transform = 'rotate(-5deg)';
          } else if (ct === 'SHARP_RIGHT') {
            $('world').style.transform = 'rotate(5deg)';
          } else {
            $('world').style.transform = 'none';
          }
        }

        // 3. Accelerometer Bump / Pothole Shockwave Impact
        var zg = d.telemetry.z_accel_g || 1.0;
        var now = Date.now();
        if (zg > 1.8 && now - lastBumpTime > 3000) {
          lastBumpTime = now;
          var stage = $('cockpitStage');
          stage.style.transform = 'translateY(10px)';
          setTimeout(function(){ stage.style.transform = 'none'; }, 150);
          toast('Pothole bump impact registered (' + zg.toFixed(2) + 'G)');
          note = { t: 'Pothole bump logged by smartphone (' + zg.toFixed(2) + 'G)', u: now + 3500 };
          beep(2);
        }

        // 4. Ingest AI Hazards from Phone Camera
        if (d.latest_hazards && d.latest_hazards.length > 0) {
          d.latest_hazards.forEach(function(hz){
            var key = 'pothole';
            if (hz.hazard_type.indexOf('ANIMAL') >= 0 || hz.hazard_type.indexOf('PEDESTRIAN') >= 0) key = 'walker';
            else if (hz.hazard_type.indexOf('CURVE') >= 0) key = 'curve';
            
            var exists = H.filter(function(x){ return x.k === key && x.d > 50; })[0];
            if (!exists) {
              H.push({ k: key, d: hz.distance_m || 200, n: 1, al: 0, conf: true });
            }
          });
        }
      }
    }).catch(function(){});

  // Fetch PiP Phone Camera Frame
  fetch('/api/smartphone/latest_frame')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var camImg = $('cam');
      if (d.frame_base64) {
        camImg.src = d.frame_base64;
        camImg.style.display = 'block';
      }
    }).catch(function(){});
}

// Real-Time Zero-Latency WebSocket Hub (/api/ws/telemetry)
var ws;
function connectTelemetryWs() {
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try {
    ws = new WebSocket(proto + '//' + location.host + '/api/ws/telemetry');
    ws.onmessage = function(ev) {
      try {
        var d = JSON.parse(ev.data);
        if (d.telemetry) {
          if (d.telemetry.speed_kmh !== undefined && d.telemetry.speed_kmh > 0) {
            var spd = Math.round(d.telemetry.speed_kmh);
            V = spd / 3.6;
            $('sp').textContent = spd;
            var line = $('dashLine');
            if (line) line.style.animationDuration = (17.5 / Math.max(V, 0.5)) + 's';
          }
          if (d.telemetry.road_geometry) {
            var ct = d.telemetry.road_geometry.curve_type || 'STRAIGHT';
            if (ct === 'SHARP_LEFT' || ct === 'HAIRPIN_BEND') {
              $('world').style.transform = 'rotate(-5deg)';
            } else if (ct === 'SHARP_RIGHT') {
              $('world').style.transform = 'rotate(5deg)';
            } else {
              $('world').style.transform = 'none';
            }
          }
          var zg = d.telemetry.z_accel_g || 1.0;
          var now = Date.now();
          if (zg > 1.8 && now - lastBumpTime > 2500) {
            lastBumpTime = now;
            var stage = $('cockpitStage');
            stage.style.transform = 'translateY(10px)';
            setTimeout(function(){ stage.style.transform = 'none'; }, 150);
            toast('Pothole bump impact registered (' + zg.toFixed(2) + 'G)');
            note = { t: 'Pothole bump logged by smartphone (' + zg.toFixed(2) + 'G)', u: now + 3500 };
            beep(2);
          }
        }
        if (d.frame_base64) {
          var camImg = $('cam');
          camImg.src = d.frame_base64;
          camImg.style.display = 'block';
        }
      } catch(e){}
    };
    ws.onclose = function() {
      setTimeout(connectTelemetryWs, 2000);
    };
  } catch(e){}
}
connectTelemetryWs();
